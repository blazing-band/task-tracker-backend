[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]

[tool.mypy]
mypy_path = ["src"]
packages = ["backend", "tests"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/backend"]

[tool.coverage.report]
include = ["src/backend/*"]
